name: Deploy server fe
on:
  push:
    branches:
      - master    # Only run deploy on master branch
jobs:
  build-and-upload-to-docker-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: indrafajar/pelanggaran-fe:latest  # Update this
          build-args: |
            NEXT_PUBLIC_APP_START_DATE=${{ secrets.NEXT_PUBLIC_APP_START_DATE }}
            BASE_URL=${{ secrets.BASE_URL }}
    
  deploy-vm:
    runs-on: ubuntu-latest
    needs: build-and-upload-to-docker-hub
    steps:
      - name: Deploy to VM
        env:
          HOST: ${{ secrets.VM_HOST }}  # Update with your VM IP
          USER: ${{ secrets.VM_USERNAME }}
          PASSWORD: ${{ secrets.VM_PASSWORD }}
        run: |
          sshpass -p "${PASSWORD}" ssh -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            docker pull indrafajar/pelanggaran-fe:latest
            if [ "$(docker ps -aq -f name=pelanggaran-fe-run)" ]; then
              # If container exists, stop and remove it
              if [ "$(docker ps -q -f name=pelanggaran-fe-run)" ]; then
                docker stop pelanggaran-fe-run
              fi
              docker rm pelanggaran-fe-run
              docker run -d --name pelanggaran-fe-run --restart unless-stopped --network my-app -p 5000:3000 indrafajar/pelanggaran-fe:latest
              docker cp ~/pelanggaran-fe/.env pelanggaran-fe-run:/app/
              docker restart pelanggaran-fe-run
            else
              # If container does not exist, just run it
              docker run -d --name pelanggaran-fe-run --restart unless-stopped --network my-app -p 5000:3000 indrafajar/pelanggaran-fe:latest
              docker cp ~/pelanggaran-fe/.env pelanggaran-fe-run:/app/
              docker restart pelanggaran-fe-run
            fi
            docker image prune -f
          EOF